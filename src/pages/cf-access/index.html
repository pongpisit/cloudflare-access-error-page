<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access denied — Zero Security Corp</title>
<meta name="description" content="Why Cloudflare Access blocked this request, and what to do next.">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --paper: #f4f6f3;
        --card: #ffffff;
        --ink: #191d1b;
        --muted: #454e49;
        --faint: #666f6a;
        --line: #e0e4de;
        --line-strong: #c9cec7;
        --amber: #b45309;
        --amber-ink: #92400e;
        --red: #b91c1c;
        --green: #15803d;
        --stamp-bg: rgba(180, 83, 9, 0.07);
        --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, "Cascadia Mono", "Roboto Mono", monospace;
    }

    :root[data-theme="dark"] {
        --paper: #0c0e0d;
        --card: #141715;
        --ink: #ebedea;
        --muted: #b0b9b3;
        --faint: #828b85;
        --line: #232826;
        --line-strong: #333933;
        --amber: #f0b33e;
        --amber-ink: #f7c566;
        --red: #f87d7d;
        --green: #3fd68f;
        --stamp-bg: rgba(240, 179, 62, 0.09);
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --paper: #0c0e0d;
            --card: #141715;
            --ink: #ebedea;
            --muted: #9ba49f;
            --faint: #6c756f;
            --line: #232826;
            --line-strong: #333933;
            --amber: #f0b33e;
            --amber-ink: #f7c566;
            --red: #f87d7d;
            --green: #3fd68f;
            --stamp-bg: rgba(240, 179, 62, 0.09);
        }
    }

    html {
        scrollbar-gutter: stable;
    }

    body {
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.65;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    [hidden] {
        display: none !important;
    }

    .wrap {
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        padding: 0 24px;
    }

    a:focus-visible,
    button:focus-visible,
    summary:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
        border-radius: 4px;
    }

    .skip-link {
        position: absolute;
        top: -100%;
        left: 16px;
        z-index: 9999;
        padding: 8px 16px;
        background: var(--ink);
        color: var(--paper);
        border-radius: 0 0 6px 6px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
    }

    .skip-link:focus {
        top: 0;
    }

    .bar {
        border-bottom: 1px solid var(--line);
        background: var(--card);
    }

    .bar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 60px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--ink);
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
    }

    .brand svg {
        height: 18px;
        width: auto;
        display: block;
    }

    .bar-right {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .docket {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--faint);
        text-transform: uppercase;
        white-space: nowrap;
    }

    .theme-toggle {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
    }

    .theme-toggle:hover {
        color: var(--ink);
        border-color: var(--faint);
    }

    .theme-toggle svg {
        width: 16px;
        height: 16px;
    }

    main {
        flex: 1;
        padding: 56px 24px 64px;
    }

    .verdict-top {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
    }

    .stamp {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber-ink);
        border: 2px solid currentColor;
        border-radius: 4px;
        padding: 7px 14px 6px;
        background: var(--stamp-bg);
        transform: rotate(-2deg);
        animation: stamp-in 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
    }

    .stamp--red {
        color: var(--red);
        background: color-mix(in srgb, var(--red) 8%, transparent);
    }

    .stamp--checking {
        color: var(--faint);
        border-style: dashed;
        animation: none;
        background: none;
    }

    @keyframes stamp-in {
        from {
            transform: scale(1.7) rotate(-9deg);
            opacity: 0;
        }
        to {
            transform: scale(1) rotate(-2deg);
            opacity: 1;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .stamp {
            animation: none;
        }
    }

    .verdict-meta {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.02em;
        overflow-wrap: anywhere;
    }

    .errcode {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.02em;
        border: 1px dashed var(--line-strong);
        border-radius: 6px;
        padding: 4px 10px;
        overflow-wrap: anywhere;
    }

    .verdict h1 {
        font-family: var(--font-display);
        font-size: clamp(30px, 6vw, 46px);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin-bottom: 20px;
        max-width: 21em;
    }

    .verdict-details {
        font-size: 17px;
        color: var(--muted);
        max-width: 42em;
        margin-bottom: 30px;
    }

    .verdict-hint {
        margin-top: 8px;
        margin-bottom: 28px;
        padding: 14px 16px;
        border-left: 3px solid var(--amber);
        background: var(--card);
        border-radius: 0 8px 8px 0;
        font-size: 14px;
        color: var(--muted);
        max-width: 42em;
    }

    .verdict-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 44px;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 9px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid var(--line-strong);
        background: var(--card);
        color: var(--ink);
        transition: transform 0.12s, border-color 0.12s, opacity 0.12s;
    }

    .btn:hover {
        border-color: var(--faint);
        transform: translateY(-1px);
    }

    .btn--primary {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
    }

    .btn--primary:hover {
        opacity: 0.88;
    }

    .panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 26px 28px 28px;
        margin-bottom: 24px;
    }

    .panel-label {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 20px;
    }

    .steps {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .steps li {
        display: flex;
        gap: 14px;
        align-items: baseline;
        font-size: 16.5px;
    }

    .step-n {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--amber-ink);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transform: translateY(2px);
    }

    .creds {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        margin-bottom: 24px;
    }

    .cred {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 22px 28px 24px;
    }

    .cred-title {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
        padding-bottom: 12px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--line-strong);
    }

    .cred-row {
        display: grid;
        grid-template-columns: minmax(130px, 220px) 1fr;
        column-gap: 24px;
        align-items: baseline;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
    }

    .cred-row:last-of-type {
        border-bottom: none;
    }

    .cred-label {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
    }

    .cred-value {
        font-size: 14.5px;
        font-family: var(--font-mono);
        overflow-wrap: anywhere;
    }

    .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 3px 10px 4px;
        border-radius: 999px;
        width: fit-content;
    }

    .pill--ok {
        color: var(--green);
        background: color-mix(in srgb, var(--green) 12%, transparent);
    }

    .pill--fail {
        color: var(--red);
        background: color-mix(in srgb, var(--red) 12%, transparent);
    }

    .pill--warn {
        color: var(--amber-ink);
        background: color-mix(in srgb, var(--amber) 14%, transparent);
    }

    .pill--muted {
        color: var(--muted);
        background: color-mix(in srgb, var(--muted) 12%, transparent);
    }

    .attempts-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14.5px;
    }

    .attempts-table th {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
        text-align: left;
        padding: 0 10px 10px;
        border-bottom: 1px solid var(--line-strong);
    }

    .attempts-table td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        overflow-wrap: anywhere;
    }

    .attempts-table tr:last-child td {
        border-bottom: none;
    }

    .attempts-table td .pill {
        font-size: 11px;
    }

    .debug-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 0;
    }

    .debug-toggle:hover {
        color: var(--muted);
    }

    .debug-toggle svg {
        width: 14px;
        height: 14px;
        transition: transform 0.2s;
    }

    .debug-json {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        max-height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .json-key { color: var(--amber-ink); font-weight: 600; }
    .json-string { color: var(--green); }
    .json-number { color: var(--muted); }
    .json-boolean { color: var(--red); font-weight: 600; }
    .json-null { color: var(--faint); font-weight: 600; }

    .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--amber);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 18px 0;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        .spinner {
            animation-duration: 1.6s;
        }
    }

    .foot {
        border-top: 1px solid var(--line);
        padding: 22px 0 28px;
    }

    .foot-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--faint);
    }

    @media (max-width: 760px) {
        main {
            padding: 40px 24px 48px;
        }

        .cred {
            padding: 18px 20px 20px;
        }

        .cred-row {
            grid-template-columns: minmax(104px, 42%) 1fr;
            column-gap: 16px;
        }

        .docket {
            display: none;
        }
    }
</style>
</head>

    <section class="creds" aria-label="Your credentials">

        </div>
        <div class="cred">
            <h2 class="cred-title">Posture</h2>
            <div class="loading-state" id="posture-content" role="status" aria-label="Loading device posture">
                <span class="spinner"></span>

<script>
    const IT_SUPPORT_EMAIL = 'it-support@example.com';
    const pageUrlParams = new URLSearchParams(window.location.search);
    const originalUrl = pageUrlParams.get('original_url');

    const STAMPS = {
        blocked_by_deny_policy: { text: 'Blocked by policy', red: true },
        no_allow_policy_matched: { text: 'Not on the allow list' },
        requirement_not_met: { text: 'Requirement not met' },
        posture_check_failed: { text: 'Device failed checks' },
        session_issue: { text: 'Session rejected' },
        limited: { text: 'Denied' }
    };

    document.getElementById('docket').textContent =
        'Incident ' + new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

    setVerdictMeta(originalUrl);

    function setVerdictMeta(requestedUrl) {
        const meta = document.getElementById('verdict-meta');
        let host = 'unknown application';
        if (requestedUrl) {
            try {
                host = new URL(requestedUrl.includes('://') ? requestedUrl : 'https://' + requestedUrl).host;
            } catch (error) {
                host = requestedUrl;
            }
        }
        meta.textContent = requestedUrl ? 'Requested ' + host : 'Requested application unknown';
    }

    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');
    const html = document.documentElement;

    const savedTheme = localStorage.getItem('theme');

    if (savedTheme) {
        html.setAttribute('data-theme', savedTheme);
    }

    function currentTheme() {
        return html.getAttribute('data-theme')
            || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function updateThemeIcon() {
        const isDark = currentTheme() === 'dark';
        sunIcon.style.display = isDark ? 'block' : 'none';
        moonIcon.style.display = isDark ? 'none' : 'block';
    }

    updateThemeIcon();

    themeToggle.addEventListener('click', () => {
        const newTheme = currentTheme() === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon();
    });

    function toggleDebug() {
        const content = document.getElementById('debug-json');
        const toggle = document.getElementById('debug-toggle');
        const toggleBtn = document.getElementById('debug-toggle-btn');
        const isHidden = content.hidden;
        content.hidden = !isHidden;
        toggle.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        toggleBtn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
    }

    function reloadApplication() {
        if (originalUrl) {
            let decodedUrl = decodeURIComponent(originalUrl);
            if (!decodedUrl.startsWith('http://') && !decodedUrl.startsWith('https://')) {
                decodedUrl = 'https://' + decodedUrl;
            }
            window.location.replace(decodedUrl);
        } else {
            window.location.reload();
        }
    }

    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function nextStepsFor(data) {
        const type = data && data.reason ? data.reason.type : 'limited';
        switch (type) {
            case 'no_allow_policy_matched':
                return [
                    'Check the account you signed in with — your email is shown in the You card below.',
                    'If it is the wrong one, go back to the app and sign in with your work account.',
                    'If it is correct, ask IT to add you, or one of your groups, to an Allow policy for this app.'
                ];
            case 'blocked_by_deny_policy':
                return [
                    'A Block policy stops your account or network from reaching this app on purpose.',
                    'If you are on a VPN, guest, or home network, switch to your usual work network and try again.',
                    'Otherwise, contact IT with the details below to request an exception.'
                ];
            case 'requirement_not_met':
                return [
                    'Complete the extra requirement listed above — usually MFA or a client certificate.',
                    'Return to the app and sign in again.'
                ];
            case 'posture_check_failed':
                return [
                    'Turn on the Cloudflare One client (WARP) on this device.',
                    'Fix the failing checks listed above — start CrowdStrike, update your OS, or turn on disk encryption.',
                    'This page updates as soon as your device reports a passing check.'
                ];
            case 'session_issue':
                return [
                    'Go back to the app and sign in again — your session had expired.',
                    'If it keeps failing, clear the site\u2019s cookies and sign in once more.'
                ];
            default:
                return [
                    'Review your credentials and device checks below and contact IT if anything looks wrong.'
                ];
        }
    }

    function supportSummaryText(data) {
        const lines = [];
        lines.push('I was denied access by Cloudflare Access.');
        if (data.reason) {
            lines.push('Reason: ' + data.reason.type + (data.reason.errorCode ? ' (error ' + data.reason.errorCode + ': ' + (accessErrorText(data.reason.errorCode) || '') + ')' : ''));
            lines.push('Details: ' + data.reason.details);
        }
        if (data.error) {
            lines.push('Page error: ' + data.error);
        }
        if (data.requestedUrl) lines.push('Application URL: ' + data.requestedUrl);
        if (data.app && data.app.name) lines.push('Application: ' + data.app.name);
        if (data.user) {
            if (data.user.email) lines.push('My email: ' + data.user.email);
            if (data.user.country) lines.push('My country: ' + data.user.country);
        }
        if (Array.isArray(data.failingPostureChecks) && data.failingPostureChecks.length) {
            lines.push('Failing posture checks: ' + data.failingPostureChecks.map(c => c.name).join(', '));
        }
        lines.push('Time: ' + new Date().toISOString());
        return lines.join('\n');
    }

    function copySupportDetails() {
        const summary = window.__denyReasonData ? supportSummaryText(window.__denyReasonData) : '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(summary);
        }
    }

    function setStamp(stampDef) {
        const stamp = document.getElementById('verdict-stamp');
        stamp.textContent = stampDef.text;
        stamp.classList.remove('stamp--checking', 'stamp--red');
        if (stampDef.red) stamp.classList.add('stamp--red');
    }

    function setMailto(data) {
        const appName = data.app && data.app.name ? data.app.name : (data.requestedUrl || 'Cloudflare Access application');
        document.getElementById('btn-mailto').href = 'mailto:' + IT_SUPPORT_EMAIL +
            '?subject=' + encodeURIComponent('Access denied: ' + appName) +
            '&body=' + encodeURIComponent(supportSummaryText(data));
    }

    function renderReasonInfo(data) {
        setMailto(data);

        if (!data || data.error) {
            setStamp({ text: data && data.stamp ? data.stamp : 'Unavailable', red: false });
            document.getElementById('verdict-heading').textContent = (data && data.error) || 'The reason could not be shown';
            document.getElementById('verdict-details').textContent = 'Something went wrong while working out why this request was blocked.';
            const slot = document.getElementById('verdict-hint-slot');
            if (data && data.hint) {
                slot.innerHTML = '<p class="verdict-hint">' + esc(data.hint) + '</p>';
            }
            document.getElementById('next-steps-section').hidden = true;
            document.getElementById('verdict-errcode').hidden = true;
            return;
        }

        const reason = data.reason || {};
        setStamp(STAMPS[reason.type] || { text: 'Denied' });

        const errorText = typeof accessErrorText === 'function' ? accessErrorText(reason.errorCode) : null;
        setVerdictMeta(data.requestedUrl || originalUrl);

        const errcodeEl = document.getElementById('verdict-errcode');
        if (reason.errorCode) {
            errcodeEl.textContent = 'error ' + reason.errorCode + (errorText ? ' — ' + errorText : '');
            errcodeEl.hidden = false;
        } else {
            errcodeEl.hidden = true;
        }

        document.getElementById('verdict-heading').textContent = reason.headline || 'Access denied';
        document.getElementById('verdict-details').textContent = reason.details || '';
        document.getElementById('verdict-hint-slot').innerHTML = '';

        const steps = nextStepsFor(data);
        document.getElementById('next-steps').innerHTML = steps.map((s, i) =>
            '<li><span class="step-n">' + (i + 1) + '</span><span>' + esc(s) + '</span></li>'
        ).join('');
        document.getElementById('next-steps-section').hidden = steps.length === 0;
    }

    function denyErrorData(error) {
        if (error && (error.status === 401 || error.code === 'missing_access_jwt')) {
            const host = (window.location && window.location.host) || 'this hostname';
            const onWorkersDev = /\.workers\.dev$/i.test(String(host));
            const hint = onWorkersDev
                ? 'Your identity could not be verified because this page is served on a *.workers.dev URL, which cannot be placed behind Cloudflare Access. Bind the Worker to your Access-protected custom domain and point the Access block-page redirects there.'
                : 'Your identity could not be verified because requests to ' + host + ' are not passing through Cloudflare Access. Fix: create a self-hosted Access application for ' + host + ' (Zero Trust \u2192 Access controls \u2192 Applications \u2192 Add an application \u2192 Self-hosted; this hostname with the path left empty) with an Allow policy such as Include \u2192 Everyone. Blocked users bounce through the team SSO once, without re-entering credentials, and this page then shows their exact deny reason.';
            return {
                error: 'No Cloudflare Access session on this page',
                stamp: 'No session',
                hint: hint
            };
        }
        if (error && (error.status === 500 || error.code === 'identity_unavailable')) {
            return {
                error: 'Access session could not be resolved',
                stamp: 'Unavailable',
                hint: 'The worker could not validate an Access session for you. This happens when the session cookie is missing, expired, or scoped to a different application, or when the page is not on an Access-protected custom domain (*.workers.dev has no /cdn-cgi/access/get-identity). If you are the administrator, check the page\u2019s Access application and the Zero Trust cookie domain.'
            };
        }
        return { error: 'The reason could not be shown', stamp: 'Unavailable' };
    }

    function renderFailedLogins(data) {
        const section = document.getElementById('attempts-section');
        if (!data || data.error || !data.capabilities || !data.capabilities.loginHistory || !Array.isArray(data.failedLogins) || data.failedLogins.length === 0) {
            section.hidden = true;
            return;
        }

        const rows = data.failedLogins.map(l => {
            const when = l.datetime ? new Date(l.datetime).toLocaleString() : 'Unknown';
            let reasonLabel = 'Blocked by policy';
            let pillClass = 'pill--fail';
            if (l.gatewayEnabled === false) reasonLabel = 'Gateway not enabled';
            else if (l.warpEnabled === false) reasonLabel = 'WARP not enabled';
            return `
                <tr>
                    <td>${esc(when)}</td>
                    <td>${esc(l.applicationName || 'Unknown application')}</td>
                    <td>${esc(l.identityProvider || 'Unknown')}</td>
                    <td>${esc(l.country || 'Unknown')}</td>
                    <td><span class="pill ${pillClass}">${esc(reasonLabel)}</span></td>
                </tr>`;
        }).join('');

        document.getElementById('attempts').innerHTML = `
            <table class="attempts-table">
                <thead>
                    <tr>
                        <th scope="col">When</th>
                        <th scope="col">Application</th>
                        <th scope="col">Signed in via</th>
                        <th scope="col">From</th>
                        <th scope="col">Reason</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
        section.hidden = false;
    }

    function credRow(label, value) {
        return '<div class="cred-row"><span class="cred-label">' + esc(label) + '</span><span class="cred-value">' + esc(value) + '</span></div>';
    }

    function credPill(label, okText, failText, isOk, warnIfFail) {
        const cls = isOk ? 'pill--ok' : (warnIfFail ? 'pill--warn' : 'pill--fail');
        return '<div class="cred-row"><span class="cred-label">' + esc(label) + '</span><span class="pill ' + cls + '">' + (isOk ? esc(okText) : esc(failText)) + '</span></div>';
    }

    function credError(targetId) {
        document.getElementById(targetId).innerHTML =
            '<div class="cred-row"><span class="cred-label">Status</span><span class="pill pill--muted">Unavailable</span></div>';
    }

    function renderWarpInfo(data) {
        const target = document.getElementById('you-content');
        if (data.error) {
            credError('you-content');
            return;
        }
        const groups = Array.isArray(data.userGroups) && data.userGroups.length ? data.userGroups.join(', ') : 'None';
        target.innerHTML =
            credRow('Name', data.userName || '—') +
            credRow('Email', data.userEmail || '—') +
            credRow('Groups', groups) +
            credRow('Country', data.userCountry || '—') +
            credRow('Connection IP', data.userIp || '—') +
            credPill('Cloudflare One client', 'Connected', 'Not connected', data.isWarpEnabled, true);
    }

    function renderDeviceInfo(data) {
        if (data.error) {
            credError('device-content');
            return;
        }
        const deviceType = data.deviceType
            ? data.deviceType.charAt(0).toUpperCase() + data.deviceType.slice(1)
            : '—';
        const lastSeen = data.lastSeen ? new Date(data.lastSeen).toLocaleString() : '—';
        document.getElementById('device-content').innerHTML =
            credRow('Device', data.deviceName || '—') +
            credRow('Type', deviceType) +
            credRow('Model', data.deviceModel || '—') +
            credRow('OS version', data.deviceOsVersion || '—') +
            credRow('Serial number', data.deviceSerial || '—') +
            credRow('MAC address', data.deviceMac || '—') +
            credRow('IP address', data.deviceIp || '—') +
            credRow('Client version', data.clientVersion || '—') +
            credRow('Last seen', lastSeen) +
            credRow('Device ID', data.deviceId || '—');
    }

    function renderPostureInfo(data) {
        if (data.error) {
            credError('posture-content');
            return;
        }
        const checks = Array.isArray(data.checks) ? data.checks : [];
        const target = document.getElementById('posture-content');
        if (!checks.length) {
            target.innerHTML = credRow('Status', 'No posture data reported');
            return;
        }
        target.innerHTML = checks.map(c => {
            let pillClass, pillText;
            if (c.success) {
                pillClass = 'pill--ok';
                pillText = 'Passed';
            } else if (c.error && String(c.error).toLowerCase().includes('not checked')) {
                pillClass = 'pill--muted';
                pillText = 'Not checked';
            } else {
                pillClass = 'pill--fail';
                pillText = 'Failed';
            }
            return '<div class="cred-row"><span class="cred-label">' + esc(c.name) + '</span><span class="pill ' + pillClass + '">' + pillText + '</span></div>';
        }).join('');
    }

    function syntaxHighlightJSON(obj) {
        const json = JSON.stringify(obj, null, 2);
        return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
    }

    function getDeviceIdFromToken(jwt) {
        const [header, payload, signature] = jwt.split(".");
        if (payload) {
            try {
                const decoded = JSON.parse(
                    atob(payload.replace(/_/g, "/").replace(/-/g, "+"))
                );
                return decoded.device_id || null;
            } catch (error) {
                return null;
            }
        }
        return null;
    }

    async function loadDenyReason() {
        try {
            const denyReasonData = await getDenyReasonInfo(originalUrl);
            window.__denyReasonData = denyReasonData;
            renderReasonInfo(denyReasonData);
            renderFailedLogins(denyReasonData);
        } catch (error) {
            const errData = denyErrorData(error);
            errData.requestedUrl = originalUrl;
            window.__denyReasonData = errData;
            renderReasonInfo(errData);
            renderFailedLogins(null);
        }
    }

    async function loadData() {
        try {
            loadDenyReason();

            const userDetailsQuery = originalUrl ? '?original_url=' + encodeURIComponent(originalUrl) : '';
            const userDetailsResponse = await fetch('/cf-access/api/userdetails' + userDetailsQuery);

            if (!userDetailsResponse.ok) {
                throw new Error(`User details fetch failed: ${userDetailsResponse.status}`);
            }

            const combinedData = await userDetailsResponse.json();
            const identityData = combinedData.identity || {};
            const apiDeviceData = combinedData.device || {};
            const apiPostureData = combinedData.posture || {};

            let deviceId = null;
            const cookies = document.cookie.split(';');
            const cfAuthCookie = cookies.find(c => c.trim().startsWith('CF_Authorization='));
            if (cfAuthCookie) {
                const token = cfAuthCookie.split('=')[1];
                deviceId = getDeviceIdFromToken(token);
            }

            const debugJson = document.getElementById('debug-json');
            const debugData = {
                identity: identityData,
                device: apiDeviceData,
                posture: apiPostureData,
                deviceIdFromJWT: deviceId,
                denyReason: window.__denyReasonData || null
            };
            debugJson.innerHTML = syntaxHighlightJSON(debugData);

            const [warpData, deviceData, postureData] = await Promise.all([
                Promise.resolve().then(() => getWarpInfo(identityData)).catch(err => {
                    return { error: 'Failed to load your details' };
                }),
                Promise.resolve().then(() => getDeviceInfo(identityData, deviceId, apiDeviceData)).catch(err => {
                    return { error: 'Failed to load device details' };
                }),
                Promise.resolve().then(() => getPostureInfo(identityData, apiPostureData)).catch(err => {
                    return { error: 'Failed to load posture' };
                })
            ]);

            renderWarpInfo(warpData);
            renderDeviceInfo(deviceData);
            renderPostureInfo(postureData);
        } catch (error) {
            const debugJson = document.getElementById('debug-json');
            debugJson.innerHTML = syntaxHighlightJSON({
                error: error.message,
                stack: error.stack
            });

            renderWarpInfo({ error: 'unavailable' });
            renderDeviceInfo({ error: 'unavailable' });
            renderPostureInfo({ error: 'unavailable' });
        }
    }

    loadData();
</script>
</body>
</html>
